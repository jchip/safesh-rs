name: ci

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned so new stable lints don't break CI unannounced. Bump on purpose.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Toolchain and bash versions
        run: |
          uname -a
          rustc --version
          bash --version | head -1
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p safesh-cli
      - name: Smoke test the binary
        run: |
          ./target/release/safesh --version
          ./target/release/safesh check 'ls | wc -l' | tail -1 | grep -q 'decision: allow'
      - name: Package
        run: tar -czf "safesh-${{ matrix.name }}.tar.gz" -C target/release safesh
      - uses: actions/upload-artifact@v4
        with:
          name: safesh-${{ matrix.name }}
          path: safesh-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # Native Windows under Git Bash, the shell Claude Code's Bash tool uses there. Its own job: the
  # Unix matrix steps use uname and tar, and Windows-only code needs its own clippy pass.
  windows:
    name: build (windows-x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Same pin as the lint job, so clippy results match.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64
      - name: Toolchain and Git Bash versions
        run: |
          rustc --version
          bash --version | head -1
          git --version
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests that only make sense on Unix are marked ignored on Windows, each with its reason.
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p safesh-cli
      - name: Smoke test the binary
        run: |
          ./target/release/safesh.exe --version
          ./target/release/safesh.exe check 'ls | wc -l' | tail -1 | grep -q 'decision: allow'
      - name: Package
        run: 7z a safesh-windows-x86_64.zip ./target/release/safesh.exe
      - uses: actions/upload-artifact@v4
        with:
          name: safesh-windows-x86_64
          path: safesh-windows-x86_64.zip
          if-no-files-found: error
