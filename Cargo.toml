[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# deno_permissions breaks often; pin exact and upgrade on purpose.
deno_permissions = "=0.119.0"
sys_traits = { version = "0.1.28", features = ["real", "libc"] }
shellexpand = "3.1.2"
path-absolutize = "4.0.1"
soft-canonicalize = "0.5.6"
etcetera = "0.11.0"
rustix = { version = "1.1.6", features = ["process"] }
fs-err = "3.3.2"
serde_path_to_error = "0.1.20"
# brush is pinned to one commit for parser and engine, so P2 and P3 share one AST.
brush-parser = { git = "https://github.com/reubeno/brush", rev = "b2f7782cc941d8c7777940aef1a046986c45c0c3" }
brush-core = { git = "https://github.com/reubeno/brush", rev = "b2f7782cc941d8c7777940aef1a046986c45c0c3" }
brush-builtins = { git = "https://github.com/reubeno/brush", rev = "b2f7782cc941d8c7777940aef1a046986c45c0c3" }
tokio = { version = "1.52", features = ["rt", "macros"] }
signal-hook = "0.3"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# brush-core carries the check_open patch until it lands upstream.
[patch."https://github.com/reubeno/brush"]
brush-core = { path = "vendor/brush-core" }
