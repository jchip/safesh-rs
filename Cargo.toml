[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# deno_permissions breaks often; pin exact and upgrade on purpose.
deno_permissions = "=0.119.0"
sys_traits = { version = "0.1.28", features = ["real", "libc"] }
shellexpand = "3.1.2"
path-absolutize = "4.0.1"
soft-canonicalize = "0.5.6"
etcetera = "0.11.0"
rustix = { version = "1.1.6", features = ["process"] }
fs-err = "3.3.2"
serde_path_to_error = "0.1.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
