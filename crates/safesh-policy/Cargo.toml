[package]
name = "safesh-policy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The workspace lints, except `unsafe_code` is `deny` rather than `forbid`: the Win32 calls in `compat::win`
# need FFI and opt in with `#[allow(unsafe_code)]`.
# Keep in sync with `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
deno_permissions.workspace = true
sys_traits.workspace = true
shellexpand.workspace = true
path-absolutize.workspace = true
soft-canonicalize.workspace = true
etcetera.workspace = true
rustix.workspace = true
fs-err.workspace = true
serde_path_to_error.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
