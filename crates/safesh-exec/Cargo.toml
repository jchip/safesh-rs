[package]
name = "safesh-exec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The workspace lints, except `unsafe_code` is `deny` rather than `forbid`: the Windows parent kill
# in `stop_parents` needs Win32 FFI and opts in with `#[allow(unsafe_code)]`. Keep in sync with
# `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
brush-core.workspace = true
brush-builtins.workspace = true
safesh-policy = { path = "../safesh-policy" }
thiserror.workspace = true
tokio.workspace = true
rustix.workspace = true
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
